[mod-name]
TreeRegrow=Tree Regrowth & Saplings

[mod-description]
TreeRegrow=Forests slowly spread onto nearby natural ground. Chop trees for saplings (or craft them from wood) and plant them anywhere natural — pave around a tree with concrete to keep it as a single decorative tree.

[item-name]
tree-sapling=Tree sapling
treeregrow-reforest-planner=Reforest planner

[item-description]
tree-sapling=Plant on natural ground to grow a tree. It takes after the dominant species nearby, so use it to restore local forests — or place one alone and pave around it to keep it as a single decorative tree. Saplings can be placed as ghosts, so robots can plant them.
treeregrow-reforest-planner=Drag over an area to plan saplings on its natural ground, in a loose natural scatter; robots plant them from saplings in your inventory or network. Alt-drag removes planned saplings.

[entity-name]
treeregrow-planted-sapling=Planted sapling

[entity-description]
treeregrow-planted-sapling=A young tree. It grows into a full tree after a short while, taking after the most common species nearby. Unlike trees, it can be placed as a ghost, so robots can plant it and it can go in blueprints.

[shortcut-name]
treeregrow-reforest-planner=Reforest planner

[recipe-name]
tree-sapling=Tree sapling

[treeregrow]
planned=__1__ saplings planned
unplanned=__1__ planned saplings removed

[technology-name]
treeregrow-forestry=Forestry
treeregrow-gmo-trees=GMO trees

[technology-description]
treeregrow-forestry=Unlocks crafting tree saplings from wood, so forests can be replanted at scale. Saplings can still be found by chopping trees before this is researched.
treeregrow-gmo-trees=Engineered trees regrow their leaves even in heavy pollution. Pollution still strips them, and trees absorb pollution as they lose leaves, so forests next to your factory keep cleaning the air instead of wearing out.

[modifier-description]
treeregrow-gmo-trees=Trees regrow lost leaves at any pollution level and keep absorbing pollution.

[mod-setting-name]
treeregrow-sapling-drop-chance=Sapling drop chance when mining trees
treeregrow-enable-sapling-recipe=Enable sapling crafting recipe (4 wood)
treeregrow-enable-spread=Trees spread naturally
treeregrow-spread-attempts=Spread attempts per cycle
treeregrow-spread-distance=Maximum spread distance (tiles)
treeregrow-max-density=Maximum local tree density
treeregrow-pollution-blocks-spread=Pollution blocks spreading
treeregrow-match-nearby-species=Saplings match nearby tree species
treeregrow-enable-leaf-regrowth=Polluted trees regrow their leaves
treeregrow-leaf-regrowth-pollution=Leaf regrowth pollution limit
treeregrow-leaf-regrowth-minutes=Leaf regrowth time (minutes)
treeregrow-sapling-grow-seconds=Sapling growth time (seconds)
treeregrow-planner-spacing=Reforest planner spacing (tiles)

[mod-setting-description]
treeregrow-sapling-drop-chance=Chance that mining a living tree also yields a tree sapling.
treeregrow-enable-sapling-recipe=When enabled, the Forestry technology (25 automation science) unlocks crafting a sapling from 4 wood. When disabled, saplings only come from chopping trees.
treeregrow-spread-attempts=How many random map locations are tested for tree spreading per surface, every 5 seconds. Higher values mean faster regrowth.
treeregrow-spread-distance=How far from a parent tree a new tree can appear.
treeregrow-max-density=No new tree appears where this many trees already stand within 5 tiles, so forests creep outward instead of thickening endlessly.
treeregrow-pollution-blocks-spread=Trees will not spread into polluted areas.
treeregrow-match-nearby-species=A planted sapling grows into the most common tree species within 16 tiles. If disabled (or no trees are nearby), it grows into the default green tree.
treeregrow-enable-leaf-regrowth=Trees that lost leaves to pollution slowly grow them back once the air around them is clean enough.
treeregrow-leaf-regrowth-pollution=Trees regrow leaves only in chunks with less pollution than this. Capped at the level where pollution starts damaging trees (60 unless the map settings change it), so trees never heal while pollution is still stripping them. Lower it to keep trees bare further out from your base.
treeregrow-leaf-regrowth-minutes=How long a completely bare tree takes to grow all its leaves back.
treeregrow-sapling-grow-seconds=How long a planted sapling takes to grow into a full tree. 0 grows it immediately.
treeregrow-planner-spacing=The reforest planner puts one sapling in each square of this size, at a random spot inside it.
